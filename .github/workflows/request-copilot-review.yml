name: Request Copilot review
on:
  pull_request_target:
    types: [labeled]

jobs:
  request-copilot-review:
    if: github.event.label.name == 'request-copilot-review'
    permissions:
      pull-requests: write
    uses: scratchfoundation/.github/.github/workflows/request-copilot-review.yml@91a2e0e0b4d90244b09f242d16f38fc30e1c8fd7 # main
    secrets:
      COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
