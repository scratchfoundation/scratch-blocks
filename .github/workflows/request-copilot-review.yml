name: Request Copilot review
on:
  pull_request_target:
    types: [labeled]

jobs:
  request-copilot-review:
    if: github.event.label.name == 'request-copilot-review'
    permissions:
      pull-requests: write
    uses: scratchfoundation/.github/.github/workflows/request-copilot-review.yml@d081d35ff1da8b5f9b08f88287aa7a76cd2cbcad # main
    secrets:
      COPILOT_REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
